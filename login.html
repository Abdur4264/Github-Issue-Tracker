<!doctype html>
<html lang="en" data-page="login">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | GitHub Issues Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon" href="assets/logo-github-nav.svg" type="image/svg+xml" />
  </head>

  <body class="min-h-screen touch-manipulation bg-[#f8fafc] font-['Geist',ui-sans-serif,system-ui,sans-serif] text-[#1f2937]">
    <main class="flex min-h-screen items-center justify-center px-4 py-10 sm:py-25">
      <section
        class="flex w-full max-w-130 flex-col items-center gap-6 rounded-lg border border-white bg-white p-6 shadow-[0_5px_10px_rgba(0,0,0,0.08)] sm:p-8"
        aria-labelledby="login-title"
      >
        <header class="flex w-full flex-col items-center gap-6">
          <div class="flex size-25 items-center justify-center">
            <img
              src="assets/logo github.svg"
              alt=""
              width="100"
              height="98"
              class="block h-auto w-25"
            />
          </div>
          <div class="flex w-full flex-col items-center gap-1 text-center">
            <h1 id="login-title" class="text-[24px] font-semibold text-[#1f2937]">
              GitHub Issues Tracker
            </h1>
            <p class="text-[16px] text-[#64748b]">Sign in to manage your issues</p>
          </div>
        </header>

        <form id="login-form" class="flex w-full flex-col gap-6" novalidate>
          <div class="flex w-full flex-col gap-4">
            <div class="flex w-full flex-col gap-2">
              <label for="username" class="text-[16px] font-medium text-[#1f2937]">Username</label>
              <div class="flex w-full flex-col gap-1.5">
                <input
                  id="username"
                  name="username"
                  type="text"
                  autocomplete="username"
                  spellcheck="false"
                  autocapitalize="none"
                  placeholder="Enter Username"
                  aria-describedby="username-hint username-error"
                  class="h-12 w-full rounded-lg border border-[#e4e4e7] bg-white px-4 text-[16px] leading-4 text-[#1f2937] placeholder:text-[#64748b] aria-invalid:border-[#ef4444] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#4a00ff]"
                />
                <p id="username-hint" class="text-[14px] text-[#4a00ff]">Default: admin</p>
                <p id="username-error" class="hidden text-[14px] text-[#dc2626]"></p>
              </div>
            </div>

            <div class="flex w-full flex-col gap-2">
              <label for="password" class="text-[16px] font-medium text-[#1f2937]">Password</label>
              <div class="flex w-full flex-col gap-1.5">
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="Enter Password"
                  aria-describedby="password-hint password-error"
                  class="h-12 w-full rounded-lg border border-[#e4e4e7] bg-white px-4 text-[16px] leading-4 text-[#1f2937] placeholder:text-[#64748b] aria-invalid:border-[#ef4444] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#4a00ff]"
                />
                <p id="password-hint" class="text-[14px] text-[#4a00ff]">Default: admin123</p>
                <p id="password-error" class="hidden text-[14px] text-[#dc2626]"></p>
              </div>
            </div>
          </div>

          <p
            id="login-error"
            class="hidden rounded-lg border border-[#fecaca] bg-[#feecec] px-4 py-3 text-[14px] text-[#b91c1c]"
            role="alert"
          ></p>

          <button
            type="submit"
            class="h-12 w-full cursor-pointer rounded-lg bg-[#4a00ff] px-4 text-[16px] leading-4 font-semibold text-white transition-colors hover:bg-[#3d00d6] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#4a00ff]"
          >
            Sign In
          </button>
        </form>

        <div class="flex w-full items-center gap-2" aria-hidden="true">
          <img src="assets/icons/divider-line.svg" alt="" class="h-px min-w-0 flex-1" />
          <span class="text-[16px] text-[#1f2937]">OR</span>
          <img src="assets/icons/divider-line.svg" alt="" class="h-px min-w-0 flex-1" />
        </div>

        <section class="flex w-full flex-col items-center gap-2" aria-labelledby="demo-title">
          <h2 id="demo-title" class="text-[14px] font-normal text-[#64748b]">Demo Credentials:</h2>
          <div class="flex w-full items-center justify-center rounded-lg bg-[#f8fafc] p-6">
            <p class="text-center text-[16px] text-[#1f2937]">
              <span class="font-semibold">Username:</span> admin<br />
              <span class="font-semibold">Password:</span> admin123
            </p>
          </div>
        </section>
      </section>
    </main>
  </body>
